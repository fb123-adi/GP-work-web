# Publishes the app in project/ to the gh-pages branch on every push to main.
# GitHub Pages serves the site from that branch.
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
    paths: ['project/**']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Push project/ to gh-pages
        run: |
          git subtree split --prefix project -b gh-pages-new
          git push -f origin gh-pages-new:gh-pages
